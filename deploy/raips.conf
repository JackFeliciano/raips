# One server block for one host. The name, the paths and the port are placeholders.
#
# The preview process listens on loopback only. nginx terminates TLS and passes
# the request through, so the PHP process needs no certificate and no root.

server {
    listen 80;
    listen [::]:80;
    server_name raips.example.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name raips.example.org;

    ssl_certificate     /etc/letsencrypt/live/raips.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raips.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:raips:5m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 2m;

    access_log /var/log/nginx/raips.access.log;
    error_log  /var/log/nginx/raips.error.log;

    location / {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
